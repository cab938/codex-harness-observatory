[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-harness-observatory"
dynamic = ["version"]
description = "A lightly isolated, telemetry-enabled Codex harness for teaching."
authors = [{ name = "Christopher Brooks" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["codex", "teaching", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
observatory = "launch:main"

[project.urls]
Homepage = "https://github.com/cab938/codex-harness-observatory"
Repository = "https://github.com/cab938/codex-harness-observatory.git"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["observatory"]
py-modules = ["launch"]

[tool.setuptools.dynamic]
version = {attr = "observatory.release.VERSION"}

[tool.setuptools.package-data]
observatory = ["collection_inventory.json", "desktop_core_bridge.sh", "web/*.html", "web/*.js", "web/*.css"]

[tool.setuptools.data-files]
"share/codex-harness-observatory" = ["release.json"]
